# LiveKit SFU config for KalaNidhi.
# deploy/setup-livekit.sh renders this into data/kalanidhi/livekit.yaml (600).
# Syntax checked against livekit/livekit-server v1.13.11 config-sample.yaml.
port: 7880

rtc:
  # ICE/TCP fallback; published directly on the host, never through Traefik.
  tcp_port: 7881
  # WebRTC media. Must match the published UDP range in docker-compose.yml.
  port_range_start: 50000
  port_range_end: 50100
  # Oracle Cloud presents a private NIC IP with a 1:1 public IP; STUN discovers
  # the public address so candidates are reachable from the internet.
  use_external_ip: true

redis:
  address: livekit-redis:6379

# API key/secret substituted by setup-livekit.sh.
keys:
  "{{LIVEKIT_API_KEY}}": "{{LIVEKIT_API_SECRET}}"

turn:
  enabled: true
  # Must match the certificate Traefik presents on :5349 (Let's Encrypt).
  domain: rtc.kalanidhi.site
  udp_port: 3478
  tls_port: 5349
  # Traefik's TCP router terminates TLS on 5349 and forwards plaintext TURN,
  # so LiveKit needs no certificate files of its own.
  external_tls: true
  # Relay allocations are direct UDP on the host; keep them outside the RTC
  # media range and open 50200-50300/udp in the firewall.
  relay_range_start: 50200
  relay_range_end: 50300

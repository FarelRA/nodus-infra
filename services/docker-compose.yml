      - traefik.http.routers.singbox-trojan-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/trojan-hu`)
      - traefik.http.routers.singbox-trojan-hu.entrypoints=websecure

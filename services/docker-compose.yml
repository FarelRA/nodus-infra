# nodus production stack — bootstrap, backups, and apply steps live in README.md.
services:
  # TLS ingress, ACME, and every public route
  traefik:
    image: traefik:latest
    restart: always
    stop_grace_period: 1m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "19132:19132/tcp"
    command:
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --entrypoints.geyser-signal.address=:19132
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=false
      - --certificatesresolvers.letsencrypt.acme.email=admin@farel.at.eu.org
      - --certificatesresolvers.letsencrypt.acme.storage=/var/lib/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2405:8800::/32,2406:4700::/32,2407:4d00::/32,2a06:98c0::/29,2c0f:f248::/32,10.89.0.0/24,fd6a:53ea:c9f2:d46a::/64
    volumes:
      - /run/user/986/podman/podman.sock:/var/run/docker.sock:ro
      - ./data/traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./data/traefik/acme.json:/var/lib/traefik/acme.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.batam.oracle.farel.is-a.dev`) || Host(`traefik.batam.oracle.farel.at.eu.org`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.middlewares=defaultAuth@file
      - traefik.http.routers.dashboard.service=api@internal
    networks:
      - router

  # Static files behind basic auth at /priv
  webservice:
    image: joseluisq/static-web-server:latest
    restart: always
    stop_grace_period: 1m
    command:
      - --port=8080
      - --root=/var/public
    volumes:
      - ./data/webservice:/var/public
    labels:
      - traefik.enable=true
      - traefik.http.routers.webservice.rule=(Host(`farel.is-a.dev`) || Host(`farel.at.eu.org`)) && PathPrefix(`/priv`)
      - traefik.http.routers.webservice.entrypoints=websecure
      - traefik.http.routers.webservice.tls.certresolver=letsencrypt
      - traefik.http.routers.webservice.middlewares=defaultAuth@file
      - traefik.http.routers.webservice.service=webservice
      - traefik.http.services.webservice.loadbalancer.server.port=8080
    networks:
      - router

  # CouchDB for OSIS and other apps
  couchdb:
    image: couchdb:latest
    restart: always
    stop_grace_period: 1m
    env_file:
      - ./data/couchdb/.env
    volumes:
      - ./data/couchdb/data:/opt/couchdb/data
      - ./data/couchdb/conf:/opt/couchdb/etc/local.d
    labels:
      - traefik.enable=true
      - traefik.http.routers.couchdb.rule=Host(`couchdb.farel.at.eu.org`)
      - traefik.http.routers.couchdb.entrypoints=websecure
      - traefik.http.routers.couchdb.tls.certresolver=letsencrypt
      - traefik.http.routers.couchdb.service=couchdb
      - traefik.http.services.couchdb.loadbalancer.server.port=5984
    networks:
      - router

  # Proxy matrix: VLESS/VMess/Trojan under /sing/*
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    restart: always
    stop_grace_period: 1m
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    volumes:
      - ./data/sing-box/config.json:/etc/sing-box/config.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.singbox-vless-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vless-ws`)
      - traefik.http.routers.singbox-vless-ws.entrypoints=websecure
      - traefik.http.routers.singbox-vless-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vless-ws.service=singbox-vless-ws
      - traefik.http.services.singbox-vless-ws.loadbalancer.server.port=12001
      - traefik.http.routers.singbox-vless-ht.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vless-ht`)
      - traefik.http.routers.singbox-vless-ht.entrypoints=websecure
      - traefik.http.routers.singbox-vless-ht.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vless-ht.service=singbox-vless-ht
      - traefik.http.services.singbox-vless-ht.loadbalancer.server.port=12003
      - traefik.http.services.singbox-vless-ht.loadbalancer.server.scheme=h2c
      - traefik.http.routers.singbox-vless-grpc.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vless-grpc`)
      - traefik.http.routers.singbox-vless-grpc.entrypoints=websecure
      - traefik.http.routers.singbox-vless-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vless-grpc.service=singbox-vless-grpc
      - traefik.http.services.singbox-vless-grpc.loadbalancer.server.port=12005
      - traefik.http.services.singbox-vless-grpc.loadbalancer.server.scheme=h2c
      - traefik.http.routers.singbox-vless-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vless-hu`)
      - traefik.http.routers.singbox-vless-hu.entrypoints=websecure
      - traefik.http.routers.singbox-vless-hu.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vless-hu.service=singbox-vless-hu
      - traefik.http.services.singbox-vless-hu.loadbalancer.server.port=12006
      - traefik.http.routers.singbox-vmess-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vmess-ws`)
      - traefik.http.routers.singbox-vmess-ws.entrypoints=websecure
      - traefik.http.routers.singbox-vmess-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vmess-ws.service=singbox-vmess-ws
      - traefik.http.services.singbox-vmess-ws.loadbalancer.server.port=12007
      - traefik.http.routers.singbox-vmess-ht.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vmess-ht`)
      - traefik.http.routers.singbox-vmess-ht.entrypoints=websecure
      - traefik.http.routers.singbox-vmess-ht.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vmess-ht.service=singbox-vmess-ht
      - traefik.http.services.singbox-vmess-ht.loadbalancer.server.port=12009
      - traefik.http.services.singbox-vmess-ht.loadbalancer.server.scheme=h2c
      - traefik.http.routers.singbox-vmess-grpc.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vmess-grpc`)
      - traefik.http.routers.singbox-vmess-grpc.entrypoints=websecure
      - traefik.http.routers.singbox-vmess-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vmess-grpc.service=singbox-vmess-grpc
      - traefik.http.services.singbox-vmess-grpc.loadbalancer.server.port=12011
      - traefik.http.services.singbox-vmess-grpc.loadbalancer.server.scheme=h2c
      - traefik.http.routers.singbox-vmess-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/vmess-hu`)
      - traefik.http.routers.singbox-vmess-hu.entrypoints=websecure
      - traefik.http.routers.singbox-vmess-hu.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-vmess-hu.service=singbox-vmess-hu
      - traefik.http.services.singbox-vmess-hu.loadbalancer.server.port=12012
      - traefik.http.routers.singbox-trojan-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/trojan-ws`)
      - traefik.http.routers.singbox-trojan-ws.entrypoints=websecure
      - traefik.http.routers.singbox-trojan-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-trojan-ws.service=singbox-trojan-ws
      - traefik.http.services.singbox-trojan-ws.loadbalancer.server.port=12013
      - traefik.http.routers.singbox-trojan-ht.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/trojan-ht`)
      - traefik.http.routers.singbox-trojan-ht.entrypoints=websecure
      - traefik.http.routers.singbox-trojan-ht.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-trojan-ht.service=singbox-trojan-ht
      - traefik.http.services.singbox-trojan-ht.loadbalancer.server.port=12015
      - traefik.http.services.singbox-trojan-ht.loadbalancer.server.scheme=h2c
      - traefik.http.routers.singbox-trojan-grpc.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/sing/trojan-grpc`)
      - traefik.http.routers.singbox-trojan-grpc.entrypoints=websecure
      - traefik.http.routers.singbox-trojan-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.singbox-trojan-grpc.service=singbox-trojan-grpc
      - traefik.http.services.singbox-trojan-grpc.loadbalancer.server.port=12017

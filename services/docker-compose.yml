  # Xray: full VLESS/VMess/Trojan matrix over every transport that makes sense
  # behind Traefik (ws, gRPC, HTTPUpgrade, XHTTP over H1 and H2c). Upstream
  # removed the plain HTTP transport — XHTTP stream-one supersedes it — and
  # RAW/REALITY/mKCP/QUIC/Hysteria need their own TLS/UDP ports, so those are
  # deliberately not routed here. Credentials live in ./data/xray/config.json,
  # generated by deploy/setup-xray.sh (never committed). Ports 12101-12115.
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: always
    stop_grace_period: 1m
    volumes:
      - ./data/xray/config.json:/etc/xray/config.json:ro
    command:
      - run
      - -c
      - /etc/xray/config.json
    labels:
      - traefik.enable=true
      # vless-ws
      - traefik.http.routers.xray-vless-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vless-ws`)
      - traefik.http.routers.xray-vless-ws.entrypoints=websecure
      - traefik.http.routers.xray-vless-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vless-ws.service=xray-vless-ws
      - traefik.http.services.xray-vless-ws.loadbalancer.server.port=12101
      # vless-grpc

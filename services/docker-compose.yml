  # GrowMate app + device API
  growmate:
    image: ghcr.io/farelra/growmate-app:latest
    restart: always
    stop_grace_period: 1m
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      CONVEX_INTERNAL_URL: http://convex:3210
      NITRO_CONVEX_INTERNAL_URL: http://convex:3210
      NITRO_TRUST_PROXY: "true"
    env_file:
      - ./data/growmate/.env
    depends_on:
      convex:
        condition: service_started
      rustfs:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.growmate.rule=Host(`growmate.bond`)
      - traefik.http.routers.growmate.entrypoints=websecure
      - traefik.http.routers.growmate.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate.middlewares=sslheader@file
      - traefik.http.routers.growmate.service=growmate
      - traefik.http.services.growmate.loadbalancer.server.port=3000
      - traefik.http.routers.growmate-api.rule=Host(`api.growmate.bond`)
      - traefik.http.routers.growmate-api.entrypoints=websecure
      - traefik.http.routers.growmate-api.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate-api.middlewares=sslheader@file
      - traefik.http.routers.growmate-api.service=growmate
    networks:
      - router

  # GrowMate pitch deck
  pitch:
    image: ghcr.io/farelra/growmate-pitch:latest
    restart: always
    stop_grace_period: 1m
    environment:
      NITRO_TRUST_PROXY: "true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pitch.rule=Host(`pitch.growmate.bond`)
      - traefik.http.routers.pitch.entrypoints=websecure
      - traefik.http.routers.pitch.tls.certresolver=letsencrypt
      - traefik.http.routers.pitch.middlewares=sslheader@file
      - traefik.http.routers.pitch.service=pitch
      - traefik.http.services.pitch.loadbalancer.server.port=3000
    networks:
      - router

  # S3-compatible object storage for GrowMate
  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    stop_grace_period: 1m
    command: /data
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    env_file:
      - ./data/rustfs/.env
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.rustfs.rule=Host(`storage.growmate.bond`)
      - traefik.http.routers.rustfs.entrypoints=websecure
      - traefik.http.routers.rustfs.tls.certresolver=letsencrypt
      - traefik.http.routers.rustfs.service=rustfs
      - traefik.http.services.rustfs.loadbalancer.server.port=9000
    networks:
      - router

  # GrowMate Convex backend
  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: always
    stop_grace_period: 1m
    env_file:
      - ./data/convex/.env
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      TRUST_ALL_PROXY_HEADERS: "true"
    extra_hosts:
      - "convex.growmate.bond:host-gateway"
    volumes:
      - convex-data:/convex/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.convex-api.rule=Host(`convex.growmate.bond`) && ((PathPrefix(`/api/`) || PathPrefix(`/instance_name`)))
      - traefik.http.routers.convex-api.entrypoints=websecure
      - traefik.http.routers.convex-api.tls.certresolver=letsencrypt
      - traefik.http.routers.convex-api.service=convex-api
      - traefik.http.services.convex-api.loadbalancer.server.port=3210
      - traefik.http.routers.convex.rule=Host(`convex.growmate.bond`)
      - traefik.http.routers.convex.entrypoints=websecure
      - traefik.http.routers.convex.tls.certresolver=letsencrypt
      - traefik.http.routers.convex.service=convex-site
      - traefik.http.services.convex-site.loadbalancer.server.port=3211
    networks:
      - router

  # Fabula Convex backend
  fabula-convex:
    image: ghcr.io/convex/convex-backend:latest
    restart: always
    stop_grace_period: 1m
    stop_signal: SIGINT
    env_file:
      - ./data/fabula/.env
    environment:
      INSTANCE_NAME: fabula
      CONVEX_CLOUD_ORIGIN: https://fabula-api.farel.at.eu.org
      CONVEX_SITE_ORIGIN: https://fabula-site.farel.at.eu.org
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      TRUST_ALL_PROXY_HEADERS: "true"
    extra_hosts:
      - "fabula-api.farel.at.eu.org:host-gateway"
      - "fabula-site.farel.at.eu.org:host-gateway"
    volumes:
      - ./data/fabula/convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.fabula-convex-api.rule=Host(`fabula-api.farel.at.eu.org`)
      - traefik.http.routers.fabula-convex-api.entrypoints=websecure
      - traefik.http.routers.fabula-convex-api.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-convex-api.service=fabula-convex-api
      - traefik.http.services.fabula-convex-api.loadbalancer.server.port=3210
      - traefik.http.routers.fabula-convex-site.rule=Host(`fabula-site.farel.at.eu.org`)
      - traefik.http.routers.fabula-convex-site.entrypoints=websecure
      - traefik.http.routers.fabula-convex-site.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-convex-site.service=fabula-convex-site
      - traefik.http.services.fabula-convex-site.loadbalancer.server.port=3211
    networks:
      - router

  # Fabula Convex operator dashboard
  fabula-dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    restart: always
    stop_grace_period: 1m
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: https://fabula-api.farel.at.eu.org
    depends_on:
      fabula-convex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.fabula-dashboard.rule=Host(`fabula-admin.farel.at.eu.org`)
      - traefik.http.routers.fabula-dashboard.entrypoints=websecure
      - traefik.http.routers.fabula-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-dashboard.middlewares=defaultAuth@file
      - traefik.http.routers.fabula-dashboard.service=fabula-dashboard
      - traefik.http.services.fabula-dashboard.loadbalancer.server.port=6791
    networks:
      - router

  # Fabula app
  fabula:
    image: ghcr.io/farelra/fabula:latest
    restart: always
    stop_grace_period: 1m
    extra_hosts:
      - "fabula-api.farel.at.eu.org:host-gateway"
    depends_on:
      fabula-convex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.fabula.rule=Host(`fabula.farel.at.eu.org`)
      - traefik.http.routers.fabula.entrypoints=websecure
      - traefik.http.routers.fabula.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula.middlewares=sslheader@file
      - traefik.http.routers.fabula.service=fabula
      - traefik.http.services.fabula.loadbalancer.server.port=3000
    networks:
      - router

  # Personal site
  farelfolio:
    image: ghcr.io/farelra/farelfolio:latest
    restart: always
    stop_grace_period: 1m
    command:
      - --port=8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.farel.rule=Host(`farel.is-a.dev`)
      - traefik.http.routers.farel.entrypoints=websecure
      - traefik.http.routers.farel.tls.certresolver=letsencrypt
      - traefik.http.routers.farel.middlewares=sslheader@file
      - traefik.http.routers.farel.service=farel
      - traefik.http.services.farel.loadbalancer.server.port=8080
    networks:
      - router

  # School assignment app under /assignment/jaringan-hayati
  jaringan-hayati:
    image: ghcr.io/farelra/jaringan-hayati:latest
    restart: always
    stop_grace_period: 1m
    environment:
      NITRO_TRUST_PROXY: "true"
      NUXT_APP_BASE_URL: /assignment/jaringan-hayati/
    labels:
      - traefik.enable=true
      - traefik.http.routers.jaringan-hayati.rule=Host(`farel.is-a.dev`) && PathPrefix(`/assignment/jaringan-hayati`)
      - traefik.http.routers.jaringan-hayati.entrypoints=websecure
      - traefik.http.routers.jaringan-hayati.tls.certresolver=letsencrypt
      - traefik.http.routers.jaringan-hayati.middlewares=sslheader@file
      - traefik.http.routers.jaringan-hayati.service=jaringan-hayati
      - traefik.http.services.jaringan-hayati.loadbalancer.server.port=3000
    networks:
      - router

  # OSIS app
  osis:
    image: ghcr.io/farelra/osis-sman1bantul:latest
    restart: always
    stop_grace_period: 1m
    volumes:
      - ./data/osis/data:/app/data
      - ./data/osis/sessions:/app/sessions
    labels:
      - traefik.enable=true
      - traefik.http.routers.osis.rule=Host(`osis.farel.is-a.dev`)
      - traefik.http.routers.osis.entrypoints=websecure
      - traefik.http.routers.osis.tls.certresolver=letsencrypt
      - traefik.http.routers.osis.middlewares=sslheader@file
      - traefik.http.routers.osis.service=osis
      - traefik.http.services.osis.loadbalancer.server.port=8080
    networks:
      - router

  # Sijimban app
  sijimban:
    image: ghcr.io/farelra/sijimban:latest
    restart: always
    stop_grace_period: 1m
    environment:
      NITRO_TRUST_PROXY: "true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.sijimban.rule=Host(`sijimban.site`)
      - traefik.http.routers.sijimban.entrypoints=websecure
      - traefik.http.routers.sijimban.tls.certresolver=letsencrypt
      - traefik.http.routers.sijimban.middlewares=sslheader@file
      - traefik.http.routers.sijimban.service=sijimban
      - traefik.http.services.sijimban.loadbalancer.server.port=8080
    networks:
      - router

  # Uptime monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:next
    restart: always
    stop_grace_period: 1m
    environment:
      UPTIME_KUMA_HOST: "0.0.0.0"
      TRUST_PROXY: "true"
    volumes:
      - ./data/uptime-kuma:/app/data
      - /run/user/986/podman/podman.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`nkuma.farel.at.eu.org`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=letsencrypt
      - traefik.http.routers.kuma.service=kuma
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks:
      - router

  # Rotating Tor HTTP proxy (loopback only)
  tor-proxy:
    image: docker.io/zhaowde/rotating-tor-http-proxy:latest
    restart: always
    stop_grace_period: 1m
    environment:
      TOR_EXIT_COUNTRY: id
    ports:
      - "127.0.0.1:3128:3128"
    networks:
      - router

  # WhatsApp HTTP API + dashboard
  waha:
    image: docker.io/devlikeapro/waha:arm
    restart: always
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_PRINT_QR: "False"
      WAHA_BASE_URL: https://waha.farel.at.eu.org
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "0"
    env_file:
      - ./data/waha/.env
    volumes:
      - ./data/waha/.sessions:/app/.sessions
      - ./data/waha/.media:/app/.media
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host(`waha.farel.at.eu.org`)
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=letsencrypt
      - traefik.http.routers.waha.service=waha
      - traefik.http.services.waha.loadbalancer.server.port=3000
    networks:
      - router

  # FarelMC — Fabric 26.3 SMP, universal join (Java + Bedrock). Ground truth:
  # FarelRA/farelmc (CI builds ghcr.io/farelra/farelmc on main push).
  # Java mc.farel.is-a.dev:25565 (any Java via Via) · Bedrock :19132 (Geyser,
  # no Java account) + :19133/udp (NetherNet) · voice :24454/udp · map below.
  # Traefik manages ALL TLS: BlueMap (:8100 → https://map.mc.farel.is-a.dev)
  # and NetherNet signaling (:19132 TCP → https://mc.farel.is-a.dev, plain HTTP
  # to Geyser). Game UDP/TCP stay raw publishes (Traefik can't proxy MC UDP /
  # Bedrock WebRTC). No cert exporter, no second ACME client, no DNS tokens.
  minecraft:
    image: ghcr.io/farelra/farelmc:latest
    restart: always
    stop_grace_period: 2m
    ports:
      - "25565:25565"
      - "24454:24454/udp"   # Simple Voice Chat (Java-only)
      - "19132:19132/udp"   # Geyser Bedrock (RakNet gameplay, direct)
      - "19133:19133/udp"   # Geyser NetherNet gameplay (WebRTC, direct)
    env_file:
      - ./data/minecraft/.env
    volumes:
      - ./data/minecraft:/data
      - ./data/minecraft/config:/server/config
      - ./data/minecraft/server.properties:/server/server.properties
      - ./data/minecraft/eula.txt:/server/eula.txt
      - ./data/minecraft/state/nethernet:/server/nethernet-data
    labels:
      - traefik.enable=true
      - traefik.http.routers.bluemap.rule=Host(`map.mc.farel.is-a.dev`)
      - traefik.http.routers.bluemap.entrypoints=websecure
      - traefik.http.routers.bluemap.tls.certresolver=letsencrypt
      - traefik.http.routers.bluemap.service=bluemap
      - traefik.http.services.bluemap.loadbalancer.server.port=8100
      # NetherNet signaling: Traefik terminates TLS on the :19132 entrypoint,
      # proxies plain HTTP to Geyser (Geyser trusts 10.89.0.0/24 via
      # signaling-trusted-proxies for real player IPs + no shared rate limit).
      - traefik.http.routers.geyser-signal.rule=Host(`mc.farel.is-a.dev`)
      - traefik.http.routers.geyser-signal.entrypoints=geyser-signal
      - traefik.http.routers.geyser-signal.tls.certresolver=letsencrypt
      - traefik.http.routers.geyser-signal.service=geyser-signal
      - traefik.http.services.geyser-signal.loadbalancer.server.port=19132
    networks:
      - router

volumes:
  rustfs-data:
  convex-data:

networks:
  router:
    driver: bridge
    enable_ipv6: true

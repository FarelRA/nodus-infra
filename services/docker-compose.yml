  # KalaNidhi Digital landing page (Next.js, GHCR image from FarelRA/kalanidhi)
  kalanidhi:
    image: ghcr.io/farelra/kalanidhi:latest
    restart: always
    stop_grace_period: 1m
    env_file:
      - ./data/kalanidhi/.env
      - ./data/kalanidhi/livekit.env
    depends_on:
      convex:
        condition: service_healthy
      # The gateway is started first, but its GoPay merchant fields may still be
      # empty on a fresh host. service_started keeps the landing site up while an
      # operator fills them; the gateway healthcheck is separate.
      kalanidhi-payments:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalanidhi.rule=Host(`kalanidhi.site`) || Host(`www.kalanidhi.site`)
      - traefik.http.routers.kalanidhi.entrypoints=websecure
      - traefik.http.routers.kalanidhi.tls.certresolver=letsencrypt
      - traefik.http.routers.kalanidhi.middlewares=sslheader@file
      - traefik.http.routers.kalanidhi.service=kalanidhi
      - traefik.http.services.kalanidhi.loadbalancer.server.port=3000
    networks:
      - router

  # KalaNidhi self-hosted Convex backend. Origins, INSTANCE_SECRET, and the
  # disable/trust flags live in the generated env file (600, never committed).
  # Image is pinned to the commit behind upstream release
  # precompiled-2026-10-22-1447815 (upstream also publishes :latest).
  convex:
    image: ghcr.io/convex/convex-backend:1447815c8c697c55a35ab0fff64aa7580ca01cc8
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGINT
    env_file:
      - ./data/kalanidhi/convex.env
    # Origins and flags are also written to the generated convex.env (600) so
    # that file is self-contained; these explicit values win and must stay in
    # sync with it (they should never change after the first deploy).
    environment:
      INSTANCE_NAME: kalanidhi
      CONVEX_CLOUD_ORIGIN: https://convex.kalanidhi.site
      CONVEX_SITE_ORIGIN: https://convex-site.kalanidhi.site
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      TRUST_ALL_PROXY_HEADERS: "true"
    extra_hosts:
      - "convex.kalanidhi.site:host-gateway"
      - "convex-site.kalanidhi.site:host-gateway"
    volumes:
      - ./data/kalanidhi/convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.convex.rule=Host(`convex.kalanidhi.site`)
      - traefik.http.routers.convex.entrypoints=websecure
      - traefik.http.routers.convex.tls.certresolver=letsencrypt
      - traefik.http.routers.convex.middlewares=sslheader@file
      - traefik.http.routers.convex.service=convex
      - traefik.http.services.convex.loadbalancer.server.port=3210
      - traefik.http.routers.convex-site.rule=Host(`convex-site.kalanidhi.site`)
      - traefik.http.routers.convex-site.entrypoints=websecure
      - traefik.http.routers.convex-site.tls.certresolver=letsencrypt
      - traefik.http.routers.convex-site.middlewares=sslheader@file
      - traefik.http.routers.convex-site.service=convex-site
      - traefik.http.services.convex-site.loadbalancer.server.port=3211
    networks:
      - router

  # Convex dashboard (admin UI). Basic-auth protected by Traefik; log in with
  # the admin key from data/kalanidhi/convex-admin-key.
  convex-dashboard:
    image: ghcr.io/convex/convex-dashboard:1447815c8c697c55a35ab0fff64aa7580ca01cc8
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: https://convex.kalanidhi.site
    depends_on:
      convex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.convex-admin.rule=Host(`convex-admin.kalanidhi.site`)
      - traefik.http.routers.convex-admin.entrypoints=websecure
      - traefik.http.routers.convex-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.convex-admin.middlewares=sslheader@file,defaultAuth@file
      - traefik.http.routers.convex-admin.service=convex-admin
      - traefik.http.services.convex-admin.loadbalancer.server.port=6791
    networks:
      - router

  # KalaNidhi self-hosted GoPay/GoBiz payments gateway
  # (ghcr.io/farelra/kalanidhi-payments, built by its own CI). No Traefik
  # labels and no published port: the app reaches it at
  # http://kalanidhi-payments:8080 over the private compose network only.
  # Env (internal key, webhook secret, vault passphrase, GoPay merchant data)
  # lives in the generated data/kalanidhi/payments.env (600).
  kalanidhi-payments:
    image: ghcr.io/farelra/kalanidhi-payments:latest
    restart: always
    stop_grace_period: 1m
    # The image runs as the non-root app user (uid 100/gid 101). Rootless
    # podman must map that user onto the podman host account so it can write the
    # bind-mounted SQLite directory; without keep-id the app user is a subuid
    # and cannot create payments.sqlite in a podman-owned directory.
    user: "100:101"
    userns_mode: "keep-id:uid=100,gid=101"
    env_file:
      - ./data/kalanidhi/payments.env
    volumes:
      - ./data/kalanidhi/payments-data:/var/lib/kalanidhi
    # The image needs no writable root filesystem: SQLite lives on the bind
    # mount and the runtime needs only /tmp (matches the gateway's own compose).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The internal key comes from the container env; it is never baked into
      # the image or printed by the probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/v1/health',{headers:{'x-internal-key':process.env.INTERNAL_API_KEY||''}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - router

  # Redis for LiveKit. Internal-only network, no published port. AOF keeps the
  # room/node registry across restarts (LiveKit re-registers on boot).
  livekit-redis:
    image: redis:8.2-alpine
    restart: always
    stop_grace_period: 30s
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - ./data/kalanidhi/livekit-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - livekit-internal

  # Self-hosted LiveKit SFU. Signaling goes through Traefik on 443; media,
  # ICE/TCP and TURN stay on direct host ports (UDP does not survive an HTTP
  # proxy). TURN/TLS on 5349 is terminated by Traefik (same Let's Encrypt
  # cert as rtc.kalanidhi.site) so LiveKit needs no cert files; the config
  # therefore sets turn.external_tls. The config file is generated from
  # data/kalanidhi/livekit.env and holds the API key/secret (600).
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: always
    stop_grace_period: 1m
    command:
      - --config
      - /etc/livekit/livekit.yaml
    volumes:
      - ./data/kalanidhi/livekit.yaml:/etc/livekit/livekit.yaml:ro
    expose:
      - "5349" # TURN/TLS listener; Traefik publishes host 5349, not LiveKit
    ports:
      - "7881:7881"                   # ICE/TCP fallback (direct, not via Traefik)
      - "3478:3478/udp"               # TURN/UDP + STUN
      - "50000-50100:50000-50100/udp" # WebRTC media
      - "50200-50300:50200-50300/udp" # TURN relay allocations
    depends_on:
      livekit-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - traefik.enable=true
      # LiveKit is on two networks; pin Traefik to the project-prefixed router
      # network (compose project "services") so it never picks the internal one.
      - traefik.docker.network=services_router
      - traefik.http.routers.livekit.rule=Host(`livekit.kalanidhi.site`)
      - traefik.http.routers.livekit.entrypoints=websecure
      - traefik.http.routers.livekit.tls.certresolver=letsencrypt
      - traefik.http.routers.livekit.middlewares=sslheader@file
      - traefik.http.routers.livekit.service=livekit
      - traefik.http.services.livekit.loadbalancer.server.port=7880
      # TURN/TLS: Traefik terminates TLS on :5349 (SNI rtc.kalanidhi.site) and
      # forwards plaintext TURN to LiveKit, matching turn.external_tls: true.
      - traefik.tcp.routers.livekit-turn.rule=HostSNI(`rtc.kalanidhi.site`)
      - traefik.tcp.routers.livekit-turn.entrypoints=turn
      - traefik.tcp.routers.livekit-turn.tls.certresolver=letsencrypt
      - traefik.tcp.routers.livekit-turn.service=livekit-turn
      - traefik.tcp.services.livekit-turn.loadbalancer.server.port=5349
    networks:
      - router
      - livekit-internal

  # Uptime monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:next
    restart: always
    stop_grace_period: 1m
    environment:
      UPTIME_KUMA_HOST: "0.0.0.0"
      TRUST_PROXY: "true"
    volumes:
      - ./data/uptime-kuma:/app/data
      - /run/user/986/podman/podman.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`nkuma.farel.at.eu.org`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=letsencrypt
      - traefik.http.routers.kuma.service=kuma
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks:
      - router

  # Rotating Tor HTTP proxy (loopback only)
  tor-proxy:
    image: docker.io/zhaowde/rotating-tor-http-proxy:latest
    restart: always
    stop_grace_period: 1m
    environment:
      TOR_EXIT_COUNTRY: id
    ports:
      - "127.0.0.1:3128:3128"
    networks:
      - router

  # WhatsApp HTTP API + dashboard
  waha:
    image: docker.io/devlikeapro/waha:arm
    restart: always
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_PRINT_QR: "False"
      WAHA_BASE_URL: https://waha.farel.at.eu.org
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "0"
    env_file:
      - ./data/waha/.env
    volumes:
      - ./data/waha/.sessions:/app/.sessions
      - ./data/waha/.media:/app/.media
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host(`waha.farel.at.eu.org`)
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=letsencrypt
      - traefik.http.routers.waha.service=waha
      - traefik.http.services.waha.loadbalancer.server.port=3000
    networks:
      - router

  # FarelMC: Fabric 26.3 SMP, universal join (Java + Bedrock). Ground truth:
  # FarelRA/farelmc (CI builds ghcr.io/farelra/farelmc on main push).
  # Java mc.farel.is-a.dev:25565 (any Java via Via) · Bedrock :19132 (Geyser,
  # no Java account) + :19133/udp (NetherNet) · voice :24454/udp · map below.
  # Traefik manages ALL TLS: BlueMap (:8100 → https://map.mc.farel.is-a.dev)
  # and NetherNet signaling (:19132 TCP → https://mc.farel.is-a.dev, plain HTTP
  # to Geyser). Game UDP/TCP stay raw publishes (Traefik can't proxy MC UDP /
  # Bedrock WebRTC). No cert exporter, no second ACME client, no DNS tokens.
  minecraft:
    image: ghcr.io/farelra/farelmc:latest
    restart: always
    stop_grace_period: 2m
    stdin_open: true # podman attach = live console (stdin was /dev/null before)
    tty: true
    ports:
      - "25565:25565"
      - "127.0.0.1:25575:25575" # RCON, loopback-only (never expose to the net)
      - "24454:24454/udp"   # Simple Voice Chat (Java-only)
      - "19132:19132/udp"   # Geyser Bedrock (RakNet gameplay, direct)
      - "19133:19133/udp"   # Geyser NetherNet gameplay (WebRTC, direct)
    env_file:
      - ./data/minecraft/.env
    volumes:
      - ./data/minecraft:/data
      - ./data/minecraft/config:/server/config
      - ./data/minecraft/server.properties:/server/server.properties
      - ./data/minecraft/eula.txt:/server/eula.txt
      - ./data/minecraft/state/nethernet:/server/nethernet-data
    labels:
      - traefik.enable=true
      - traefik.http.routers.bluemap.rule=Host(`map.mc.farel.is-a.dev`)
      - traefik.http.routers.bluemap.entrypoints=websecure
      - traefik.http.routers.bluemap.tls.certresolver=letsencrypt
      - traefik.http.routers.bluemap.service=bluemap
      - traefik.http.services.bluemap.loadbalancer.server.port=8100
      # NetherNet signaling: Traefik terminates TLS on the :19132 entrypoint,
      # proxies plain HTTP to Geyser (Geyser trusts 10.89.0.0/24 via
      # signaling-trusted-proxies for real player IPs + no shared rate limit).
      - traefik.http.routers.geyser-signal.rule=Host(`mc.farel.is-a.dev`)
      - traefik.http.routers.geyser-signal.entrypoints=geyser-signal
      - traefik.http.routers.geyser-signal.tls.certresolver=letsencrypt
      - traefik.http.routers.geyser-signal.service=geyser-signal
      - traefik.http.services.geyser-signal.loadbalancer.server.port=19132
    networks:
      - router

networks:
  router:
    driver: bridge
    enable_ipv6: true
  # No published ports and no route off the host: only LiveKit and its Redis
  # are attached.
  livekit-internal:
    driver: bridge
    internal: true

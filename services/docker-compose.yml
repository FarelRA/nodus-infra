      - traefik.http.routers.xray-vless-grpc.entrypoints=websecure
      - traefik.http.routers.xray-vless-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vless-grpc.service=xray-vless-grpc
      - traefik.http.services.xray-vless-grpc.loadbalancer.server.port=12102
      - traefik.http.services.xray-vless-grpc.loadbalancer.server.scheme=h2c
      # vless-hu (HTTPUpgrade)
      - traefik.http.routers.xray-vless-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vless-hu`)
      - traefik.http.routers.xray-vless-hu.entrypoints=websecure
      - traefik.http.routers.xray-vless-hu.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vless-hu.service=xray-vless-hu
      - traefik.http.services.xray-vless-hu.loadbalancer.server.port=12103
      # vless-xhttp (H1)
      - traefik.http.routers.xray-vless-xhttp.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vless-xhttp`)
      - traefik.http.routers.xray-vless-xhttp.entrypoints=websecure
      - traefik.http.routers.xray-vless-xhttp.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vless-xhttp.service=xray-vless-xhttp
      - traefik.http.services.xray-vless-xhttp.loadbalancer.server.port=12104
      # vless-xhttp-h2 (H2c)
      - traefik.http.routers.xray-vless-xhttp-h2.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vless-xhttp-h2`)
      - traefik.http.routers.xray-vless-xhttp-h2.entrypoints=websecure
      - traefik.http.routers.xray-vless-xhttp-h2.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vless-xhttp-h2.service=xray-vless-xhttp-h2
      - traefik.http.services.xray-vless-xhttp-h2.loadbalancer.server.port=12105
      - traefik.http.services.xray-vless-xhttp-h2.loadbalancer.server.scheme=h2c
      # vmess-ws
      - traefik.http.routers.xray-vmess-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vmess-ws`)
      - traefik.http.routers.xray-vmess-ws.entrypoints=websecure
      - traefik.http.routers.xray-vmess-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vmess-ws.service=xray-vmess-ws
      - traefik.http.services.xray-vmess-ws.loadbalancer.server.port=12106
      # vmess-grpc
      - traefik.http.routers.xray-vmess-grpc.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vmess-grpc`)
      - traefik.http.routers.xray-vmess-grpc.entrypoints=websecure
      - traefik.http.routers.xray-vmess-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vmess-grpc.service=xray-vmess-grpc
      - traefik.http.services.xray-vmess-grpc.loadbalancer.server.port=12107
      - traefik.http.services.xray-vmess-grpc.loadbalancer.server.scheme=h2c
      # vmess-hu (HTTPUpgrade)
      - traefik.http.routers.xray-vmess-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vmess-hu`)
      - traefik.http.routers.xray-vmess-hu.entrypoints=websecure
      - traefik.http.routers.xray-vmess-hu.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vmess-hu.service=xray-vmess-hu
      - traefik.http.services.xray-vmess-hu.loadbalancer.server.port=12108
      # vmess-xhttp (H1)
      - traefik.http.routers.xray-vmess-xhttp.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vmess-xhttp`)
      - traefik.http.routers.xray-vmess-xhttp.entrypoints=websecure
      - traefik.http.routers.xray-vmess-xhttp.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vmess-xhttp.service=xray-vmess-xhttp
      - traefik.http.services.xray-vmess-xhttp.loadbalancer.server.port=12109
      # vmess-xhttp-h2 (H2c)
      - traefik.http.routers.xray-vmess-xhttp-h2.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/vmess-xhttp-h2`)
      - traefik.http.routers.xray-vmess-xhttp-h2.entrypoints=websecure
      - traefik.http.routers.xray-vmess-xhttp-h2.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-vmess-xhttp-h2.service=xray-vmess-xhttp-h2
      - traefik.http.services.xray-vmess-xhttp-h2.loadbalancer.server.port=12110
      - traefik.http.services.xray-vmess-xhttp-h2.loadbalancer.server.scheme=h2c
      # trojan-ws
      - traefik.http.routers.xray-trojan-ws.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/trojan-ws`)
      - traefik.http.routers.xray-trojan-ws.entrypoints=websecure
      - traefik.http.routers.xray-trojan-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-trojan-ws.service=xray-trojan-ws
      - traefik.http.services.xray-trojan-ws.loadbalancer.server.port=12111
      # trojan-grpc
      - traefik.http.routers.xray-trojan-grpc.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/trojan-grpc`)
      - traefik.http.routers.xray-trojan-grpc.entrypoints=websecure
      - traefik.http.routers.xray-trojan-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-trojan-grpc.service=xray-trojan-grpc
      - traefik.http.services.xray-trojan-grpc.loadbalancer.server.port=12112
      - traefik.http.services.xray-trojan-grpc.loadbalancer.server.scheme=h2c
      # trojan-hu (HTTPUpgrade)
      - traefik.http.routers.xray-trojan-hu.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/trojan-hu`)
      - traefik.http.routers.xray-trojan-hu.entrypoints=websecure
      - traefik.http.routers.xray-trojan-hu.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-trojan-hu.service=xray-trojan-hu
      - traefik.http.services.xray-trojan-hu.loadbalancer.server.port=12113
      # trojan-xhttp (H1)
      - traefik.http.routers.xray-trojan-xhttp.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/trojan-xhttp`)
      - traefik.http.routers.xray-trojan-xhttp.entrypoints=websecure
      - traefik.http.routers.xray-trojan-xhttp.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-trojan-xhttp.service=xray-trojan-xhttp
      - traefik.http.services.xray-trojan-xhttp.loadbalancer.server.port=12114
      # trojan-xhttp-h2 (H2c)
      - traefik.http.routers.xray-trojan-xhttp-h2.rule=(Host(`flare.farel.is-a.dev`) || Host(`flare.farel.at.eu.org`)) && PathPrefix(`/xray/trojan-xhttp-h2`)
      - traefik.http.routers.xray-trojan-xhttp-h2.entrypoints=websecure
      - traefik.http.routers.xray-trojan-xhttp-h2.tls.certresolver=letsencrypt
      - traefik.http.routers.xray-trojan-xhttp-h2.service=xray-trojan-xhttp-h2
      - traefik.http.services.xray-trojan-xhttp-h2.loadbalancer.server.port=12115
      - traefik.http.services.xray-trojan-xhttp-h2.loadbalancer.server.scheme=h2c
    networks:
      - router

  growmate:
    image: ghcr.io/farelra/growmate-app:latest
    restart: always
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      # In-cluster Convex URL so SSR never hairpins the public origin.
      # Two names on purpose: server code reads process.env at runtime, but
      # nuxt.config private keys inline at build — the server only sees NITRO_.
      CONVEX_INTERNAL_URL: http://convex:3210
      NITRO_CONVEX_INTERNAL_URL: http://convex:3210
      NITRO_TRUST_PROXY: "true"
    stop_grace_period: 1m
    env_file:
      - ./data/growmate/.env
    depends_on:
      convex:
        condition: service_started
      rustfs:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.growmate.rule=Host(`growmate.bond`)
      - traefik.http.routers.growmate.entrypoints=websecure
      - traefik.http.routers.growmate.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate.middlewares=sslheader@file
      - traefik.http.services.growmate.loadbalancer.server.port=3000
      # Device fleet API (firmware posts here; devices follow no redirects).
      - traefik.http.routers.growmate-api.rule=Host(`api.growmate.bond`)
      - traefik.http.routers.growmate-api.entrypoints=websecure
      - traefik.http.routers.growmate-api.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate-api.middlewares=sslheader@file
      - traefik.http.routers.growmate-api.service=growmate
    networks:
      - router

  # GrowMate pitch deck (static Nuxt build, no backends: no env_file, no depends_on).
  pitch:
    image: ghcr.io/farelra/growmate-pitch:latest
    restart: always
    stop_grace_period: 1m
    environment:
      NITRO_TRUST_PROXY: "true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pitch.rule=Host(`pitch.growmate.bond`)
      - traefik.http.routers.pitch.entrypoints=websecure
      - traefik.http.routers.pitch.tls.certresolver=letsencrypt
      - traefik.http.routers.pitch.middlewares=sslheader@file
      - traefik.http.services.pitch.loadbalancer.server.port=3000
    networks:
      - router

  # RustFS (MinIO deprecated): S3 API :9000. :latest floats like the rest of
  # the stack (rollback via deploy retag). Fresh rustfs-data volume required
  # (format differs from MinIO; keep minio-data server-side for rollback).
  # Creds from ./data/rustfs/.env (RUSTFS_ACCESS_KEY/SECRET_KEY).
  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    stop_grace_period: 1m
    command: /data
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    env_file:
      - ./data/rustfs/.env
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.rustfs.rule=Host(`storage.growmate.bond`)
      - traefik.http.routers.rustfs.entrypoints=websecure
      - traefik.http.routers.rustfs.tls.certresolver=letsencrypt
      - traefik.http.services.rustfs.loadbalancer.server.port=9000
    networks:
      - router

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: always
    stop_grace_period: 1m
    env_file:
      - ./data/convex/.env
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      TRUST_ALL_PROXY_HEADERS: "true"
    # Backend actions call back into the Cloud API via CONVEX_CLOUD_ORIGIN
    # (public https origin). With the public IP closed, resolve it to the
    # host gateway so traffic re-enters through traefik :443 (valid LE cert).
    extra_hosts:
      - "convex.growmate.bond:host-gateway"
    volumes:
      - convex-data:/convex/data
    labels:
      - traefik.enable=true
      # API router: /api/* and /instance_name → port 3210 (Cloud API)
      - traefik.http.routers.convex-api.rule=Host(`convex.growmate.bond`) && ((PathPrefix(`/api/`) || PathPrefix(`/instance_name`)))
      - traefik.http.routers.convex-api.entrypoints=websecure
      - traefik.http.routers.convex-api.tls.certresolver=letsencrypt
      - traefik.http.routers.convex-api.service=convex-api
      - traefik.http.services.convex-api.loadbalancer.server.port=3210
      # Default router: everything else → port 3211 (HTTP Actions / Site)
      - traefik.http.routers.convex.rule=Host(`convex.growmate.bond`)
      - traefik.http.routers.convex.entrypoints=websecure
      - traefik.http.routers.convex.tls.certresolver=letsencrypt
      - traefik.http.routers.convex.service=convex-site
      - traefik.http.services.convex-site.loadbalancer.server.port=3211
    networks:
      - router

  # fabula: all-AI cast roleplay platform. The app image bakes
  # NEXT_PUBLIC_CONVEX_URL at build time (published on every v* tag of
  # FarelRA/fabula); the backend is pinned so app and dashboard stay on the
  # same Convex build. Both public convex hostnames resolve to the host
  # gateway inside their containers so server-side calls re-enter through
  # traefik :443 with a valid certificate (the public IP is closed for
  # self-hairpin). INSTANCE_SECRET lives in ./data/fabula/.env.
  fabula-convex:
    image: ghcr.io/convex/convex-backend:5c7cb5bc7db457290f1769f95f1d1340912f7fd7
    restart: always
    stop_grace_period: 1m
    stop_signal: SIGINT
    env_file:
      - ./data/fabula/.env
    environment:
      INSTANCE_NAME: fabula
      CONVEX_CLOUD_ORIGIN: https://fabula-api.farel.at.eu.org
      CONVEX_SITE_ORIGIN: https://fabula-site.farel.at.eu.org
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      TRUST_ALL_PROXY_HEADERS: "true"
    extra_hosts:
      - "fabula-api.farel.at.eu.org:host-gateway"
      - "fabula-site.farel.at.eu.org:host-gateway"
    volumes:
      - ./data/fabula/convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      # Cloud API (what the app and dashboard talk to) -> 3210
      - traefik.http.routers.fabula-convex-api.rule=Host(`fabula-api.farel.at.eu.org`)
      - traefik.http.routers.fabula-convex-api.entrypoints=websecure
      - traefik.http.routers.fabula-convex-api.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-convex-api.service=fabula-convex-api
      - traefik.http.services.fabula-convex-api.loadbalancer.server.port=3210
      # HTTP actions origin -> 3211
      - traefik.http.routers.fabula-convex-site.rule=Host(`fabula-site.farel.at.eu.org`)
      - traefik.http.routers.fabula-convex-site.entrypoints=websecure
      - traefik.http.routers.fabula-convex-site.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-convex-site.service=fabula-convex-site
      - traefik.http.services.fabula-convex-site.loadbalancer.server.port=3211
    networks:
      - router

  # Deployment env vars, data browser, logs. Public behind defaultAuth@file;
  # the deployment admin key unlocks the deployment on top of that.
  fabula-dashboard:
    image: ghcr.io/convex/convex-dashboard:5c7cb5bc7db457290f1769f95f1d1340912f7fd7
    restart: always
    stop_grace_period: 1m
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: https://fabula-api.farel.at.eu.org
    depends_on:
      fabula-convex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.fabula-dashboard.rule=Host(`fabula-admin.farel.at.eu.org`)
      - traefik.http.routers.fabula-dashboard.entrypoints=websecure
      - traefik.http.routers.fabula-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula-dashboard.middlewares=defaultAuth@file
      - traefik.http.services.fabula-dashboard.loadbalancer.server.port=6791
    networks:
      - router

  fabula:
    image: ghcr.io/farelra/fabula:latest
    restart: always
    stop_grace_period: 1m
    # Server-side rendering calls the public convex origin baked into the
    # image; resolve it to the host gateway so it re-enters through traefik.
    extra_hosts:
      - "fabula-api.farel.at.eu.org:host-gateway"
    depends_on:
      fabula-convex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.fabula.rule=Host(`fabula.farel.at.eu.org`)
      - traefik.http.routers.fabula.entrypoints=websecure
      - traefik.http.routers.fabula.tls.certresolver=letsencrypt
      - traefik.http.routers.fabula.middlewares=sslheader@file
      - traefik.http.services.fabula.loadbalancer.server.port=3000
    networks:
      - router

  farelfolio:
    image: ghcr.io/farelra/farelfolio:latest
    restart: always
    stop_grace_period: 1m
    command:
      - --port=8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.farel.rule=Host(`farel.is-a.dev`)
      - traefik.http.routers.farel.entrypoints=websecure
      - traefik.http.routers.farel.tls.certresolver=letsencrypt
      - traefik.http.services.farel-svc.loadbalancer.server.port=8080
      - traefik.http.routers.farel.middlewares=sslheader@file
    networks:
      - router

  jaringan-hayati:
    image: ghcr.io/farelra/jaringan-hayati:latest
    restart: always
    environment:
      NITRO_TRUST_PROXY: "true"
      NUXT_APP_BASE_URL: /assignment/jaringan-hayati/
    stop_grace_period: 1m
    labels:
      - traefik.enable=true
      - traefik.http.routers.jaringan-hayati.rule=Host(`farel.is-a.dev`) && PathPrefix(`/assignment/jaringan-hayati`)
      - traefik.http.routers.jaringan-hayati.entrypoints=websecure
      - traefik.http.routers.jaringan-hayati.tls.certresolver=letsencrypt
      - traefik.http.services.jaringan-hayati.loadbalancer.server.port=3000
      - traefik.http.routers.jaringan-hayati.middlewares=sslheader@file
    networks:
      - router

  osis:
    image: ghcr.io/farelra/osis-sman1bantul:latest
    restart: always
    stop_grace_period: 1m
    volumes:
      - ./data/osis/data:/app/data
      - ./data/osis/sessions:/app/sessions
    labels:
      - traefik.enable=true
      - traefik.http.routers.osis.rule=Host(`osis.farel.is-a.dev`)
      - traefik.http.routers.osis.entrypoints=websecure
      - traefik.http.routers.osis.tls.certresolver=letsencrypt
      - traefik.http.services.osis-svc.loadbalancer.server.port=8080
      - traefik.http.routers.osis.middlewares=sslheader@file
    networks:
      - router

  sijimban:
    image: ghcr.io/farelra/sijimban:latest
    restart: always
    environment:
      - NITRO_TRUST_PROXY=true
    stop_grace_period: 1m
    labels:
      - traefik.enable=true
      - traefik.http.routers.sijimban.rule=Host(`sijimban.site`)
      - traefik.http.routers.sijimban.entrypoints=websecure
      - traefik.http.routers.sijimban.tls.certresolver=letsencrypt
      - traefik.http.services.sijimban-svc.loadbalancer.server.port=8080
      - traefik.http.routers.sijimban.middlewares=sslheader@file
    networks:
      - router

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: always
    stop_grace_period: 1m
    environment:
      - UPTIME_KUMA_HOST=0.0.0.0
      - TRUST_PROXY=true
    volumes:
      - ./data/uptime-kuma:/app/data
      - /run/user/986/podman/podman.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`nkuma.farel.at.eu.org`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=letsencrypt
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks:
      - router

  tor-proxy:
    image: docker.io/zhaowde/rotating-tor-http-proxy:latest
    restart: always
    stop_grace_period: 1m
    environment:
      - TOR_EXIT_COUNTRY=id
    ports:
      - "127.0.0.1:3128:3128"
    networks:
      - router

  waha:
    image: docker.io/devlikeapro/waha:arm
    restart: always
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_PRINT_QR=False
      - WAHA_BASE_URL=https://waha.farel.at.eu.org
      - WAHA_MEDIA_STORAGE=LOCAL
      - WHATSAPP_FILES_FOLDER=/app/.media
      - WHATSAPP_FILES_LIFETIME=0
    env_file:
      - ./data/waha/.env
    volumes:
      - ./data/waha/.sessions:/app/.sessions
      - ./data/waha/.media:/app/.media
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host(`waha.farel.at.eu.org`)
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=letsencrypt
      - traefik.http.services.waha-svc.loadbalancer.server.port=3000
    networks:
      - router

volumes:
  rustfs-data:
  convex-data:

networks:
  router:
    driver: bridge
    enable_ipv6: true

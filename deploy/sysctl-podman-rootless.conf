# Official rootless Podman prerequisites (containers/podman rootless.md).
# Installed to /etc/sysctl.d/99-podman-rootless.conf by deploy/setup.sh.

# Allow rootless containers to bind ports >= 80 (Traefik web/websecure).
net.ipv4.ip_unprivileged_port_start = 80

# Allow ping inside rootless containers.
net.ipv4.ping_group_range = 0 2147483647
